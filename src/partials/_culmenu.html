<nav id="main-menu" data-cul-menu class="cul-menu-loading">
	<ul class="list-unstyled w-100">
	{{#each culmenu}}
	<li class="mb-1" id="{{lowerdash @key}}-menu">
		<button class="btn btn-toggle ps-0 d-inline-flex w-100 align-items-center rounded border-0 collapsed" data-bs-toggle="collapse" data-bs-target="#{{lowerdash @key}}-collapse" aria-expanded="false">
			{{{@key}}}
		</button>
		<div id="{{lowerdash @key}}-collapse" class="collapse">
			<ul class="btn-toggle-nav list-unstyled fw-normal pb-1">
			{{#each this}}
			<li>
				<a class="d-block" href="{{href}}">{{{value}}}</a>
			</li>
			{{/each}}
			</ul>
		</div>
	</li>
	{{/each}}
	</ul>
</nav>
